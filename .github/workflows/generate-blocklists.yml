name: Generate Blocklists

on:
  schedule:
    # Run daily at 1 AM UTC, and 8 PM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      allow_deletions:
        description: 'Allow deletions of existing lists'
        required: false
        default: 'false'
        type: string
  push:
    branches:
      - main
    paths:
      - 'lists.yaml'
      - 'generate.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Create lists directory
        run: mkdir -p lists
      
      - name: Generate lists
        run: python generate.py lists.yaml lists

      - name: Verify 10% drift limit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python verify.py lists 10.0 ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_deletions == 'true') && 'true' || 'false' }}

      - name: Upload lists to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # Upload all generated list files to R2
          echo "Uploading blocklists to R2 bucket: $R2_BUCKET_NAME"
          aws s3 sync lists/ s3://$R2_BUCKET_NAME/lists/ \
            --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com \
            --exclude "*.git*" \
            --delete \
            --debug 2>&1 | grep -E '(upload|delete):' || true
          
          echo "Successfully uploaded blocklists to R2"
